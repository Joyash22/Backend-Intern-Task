services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dlt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dlt_password}
      POSTGRES_DB: ${POSTGRES_DB:-hubspot_etl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlt_user} -d ${POSTGRES_DB:-hubspot_etl}"]
      interval: 5s
      timeout: 5s
      retries: 10

  hubspot-deals-etl:
    build: .
    env_file: .env
    ports:
      - "${SERVICE_PORT:-5200}:${SERVICE_PORT:-5200}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pipelines:/app/.pipelines
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVICE_PORT:-5200}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pipelines:
